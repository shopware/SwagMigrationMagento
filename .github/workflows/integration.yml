name: Integration

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  danger:
    name: Danger Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.2
          extensions: ctype, intl, mbstring
          coverage: none

      - name: Install Danger
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: vendor-bin/danger-php

      - name: Run Danger PHP
        run: vendor-bin/danger-php/vendor/bin/danger ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}

  phpunit:
    name: PHPUnit Tests
    uses: ./.github/workflows/action-phpunit.yml
    with:
      extension_name: ${{ github.event.repository.name }}
      platform_branch: trunk
      coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
