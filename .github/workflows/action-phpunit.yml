name: Reusable PHPUnit

on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      platform_branch:
        required: false
        type: string
        default: trunk
      assistant_branch:
        required: false
        type: string
        default: ""
      coverage:
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mysql_image: ["mysql:8.0", "mariadb:10.11"]
        php_version: ["8.2", "8.3"]
    env:
      COVERAGE: ${{ inputs.coverage && matrix.mysql_image == 'mysql:8.0' && matrix.php_version == '8.3' }}
    steps:
      - name: Checkout SwagMigrationMagento
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: custom/plugins/${{ inputs.extension_name }}

      - name: Setup SwagMigrationMagento
        uses: ./custom/plugins/SwagMigrationMagento/.github/actions/setup-magento-plugin
        with:
          php-version: ${{ matrix.php_version }}
          mysql-version: ${{ matrix.mysql_image }}
          platform-branch: ${{ inputs.platform_branch }}
          assistant-branch: ${{ inputs.assistant_branch }}

      - name: Run PHPUnit
        working-directory: custom/plugins/${{ inputs.extension_name }}
        run: |
          composer dump-autoload --dev
          php -d pcov.enabled=${{ env.COVERAGE == 'true' && '1' || '0' }} -d pcov.directory=${PWD}/src -d pcov.exclude='~(vendor|tests|node_modules)~' ${GITHUB_WORKSPACE}/vendor/bin/phpunit --configuration phpunit.xml.dist ${{ env.COVERAGE == 'true' && '--coverage-clover clover.xml' || '' }}

      - name: Upload coverage to Codecov
        if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          root_dir: ${{ github.workspace }}/custom/plugins/${{ inputs.extension_name }}
          working-directory: ${{ github.workspace }}/custom/plugins/${{ inputs.extension_name }}
          files: ./clover.xml
