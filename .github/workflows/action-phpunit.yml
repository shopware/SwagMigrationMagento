name: Reusable PHPUnit

on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      platform_branch:
        required: false
        type: string
        default: trunk
      assistant_branch:
        required: false
        type: string
        default: ""

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql_image: ["mysql:8.0", "mariadb:10.11"]
        php_version: ["8.2", "8.3"]
    steps:
      - name: Checkout SwagMigrationMagento
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: custom/plugins/${{ inputs.extension_name }}

      - name: Setup SwagMigrationMagento
        uses: ./custom/plugins/SwagMigrationMagento/.github/actions/setup-magento-plugin
        with:
          php-version: ${{ matrix.php_version }}
          mysql-version: ${{ matrix.mysql_image }}
          platform-branch: ${{ inputs.platform_branch }}
          assistant-branch: ${{ inputs.assistant_branch }}

      - name: Run PHPUnit
        working-directory: custom/plugins/${{ inputs.extension_name }}
        run: |
          composer dump-autoload --dev
          php -d pcov.enabled=1 -d pcov.directory=${PWD}/src -d pcov.exclude='~(vendor|tests|node_modules)~' ${GITHUB_WORKSPACE}/vendor/bin/phpunit --configuration phpunit.xml.dist
