name: Setup SwagMigrationMagento
description: "Setup steps for SwagMigrationMagento"
author: "shopware AG"
branding:
  color: "blue"
  icon: "download"

inputs:
  php-version:
    default: "8.2"
    required: false
    description: "Which PHP version should be used"
  mysql-version:
    default: "builtin"
    required: false
    description: "Which MySQL version should be used"
  platform-branch:
    default: "trunk"
    required: false
    description: "Which Shopware version should be used"
  assistant-branch:
    default: ""
    required: false
    description: "Which SwagMigrationAssistant branch to use. Defaults to the highest release tag matching the composer.json constraint (release/<version>)."

runs:
  using: composite
  steps:
    - name: Resolve SwagMigrationAssistant branch
      shell: bash
      run: |
        set -euo pipefail

        if [ -n "${{ inputs.assistant-branch }}" ]; then
          echo "ASSISTANT_BRANCH=${{ inputs.assistant-branch }}" >> $GITHUB_ENV
          exit 0
        fi

        COMPOSER_JSON="${GITHUB_ACTION_PATH}/../../../composer.json"
        CONSTRAINT=$(jq -r '.require["swag/migration-assistant"]' "$COMPOSER_JSON")
        MAJOR=$(echo "$CONSTRAINT" | grep -oE '[0-9]+' | head -1)

        if [ -z "$MAJOR" ]; then
          echo "Failed to parse major version from constraint: $CONSTRAINT" >&2
          exit 1
        fi

        VERSION=$(gh api --paginate repos/shopware/SwagMigrationAssistant/releases --jq '.[].tag_name' \
          | grep -E "^v?${MAJOR}\." \
          | sort -V \
          | tail -1)

        if [ -z "$VERSION" ]; then
          echo "No SwagMigrationAssistant release tag found matching major ${MAJOR} (constraint: ${CONSTRAINT})" >&2
          exit 1
        fi

        echo "Resolved SwagMigrationAssistant ${VERSION} for constraint ${CONSTRAINT}"
        echo "ASSISTANT_BRANCH=release/${VERSION}" >> $GITHUB_ENV
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Setup SwagMigrationMagento
      uses: shopware/github-actions/setup-extension@main
      with:
        extensionName: SwagMigrationMagento
        install: true
        install-admin: true
        shopwareVersion: ${{ inputs.platform-branch }}
        phpVersion: ${{ inputs.php-version }}
        mysqlVersion: ${{ inputs.mysql-version }}
        extraRepositories: |
          {
            "SwagMigrationAssistant": {
              "type": "path",
              "url": "custom/plugins/SwagMigrationAssistant",
              "symlink": true
            },
            "${{ github.event.repository.name }}": {
              "type": "path",
              "url": "custom/plugins/${{ github.event.repository.name }}",
              "symlink": true
            }
          }
        dependencies: |
          [
            {
              "name": "SwagMigrationAssistant",
              "repo": "https://github.com/shopware/SwagMigrationAssistant.git",
              "branch": "${ASSISTANT_BRANCH}"
            }
          ]
